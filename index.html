<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Idom — Software Developer</title>
  <meta name="description" content="Idom - Software Developer building Discord bots, websites and custom RP systems." />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="#home" class="nav-logo">Idom</a>

      <nav class="nav-links" id="navLinks">
        <a href="#home" data-i18n="nav.home" class="nav-link"></a>
        <a href="#about" data-i18n="nav.about" class="nav-link"></a>
        <a href="#skills" data-i18n="nav.skills" class="nav-link"></a>
        <a href="#projects" data-i18n="nav.projects" class="nav-link"></a>
        <a href="#systems" data-i18n="nav.systems" class="nav-link"></a>
        <a href="#contact" data-i18n="nav.contact" class="nav-link"></a>
      </nav>

      <div class="nav-actions">
        <div class="lang-select" id="langSelect">
          <button class="lang-toggle" id="langToggle" aria-haspopup="listbox" aria-expanded="false">
            <span id="langCurrentFlag">🇸🇦</span>
            <svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <ul class="lang-menu" id="langMenu" role="listbox">
            <li role="option" data-lang="ar"><span>🇸🇦</span> العربية</li>
            <li role="option" data-lang="en"><span>🇬🇧</span> English</li>
            <li role="option" data-lang="tr"><span>🇹🇷</span> Türkçe</li>
            <li role="option" data-lang="es"><span>🇪🇸</span> Español</li>
            <li role="option" data-lang="de"><span>🇩🇪</span> Deutsch</li>
          </ul>
        </div>

        <button class="avatar-btn" id="avatarBtn" aria-label="Refresh">
          <img src="https://files.catbox.moe/mlx3eq.jpeg" alt="Idom avatar" />
        </button>

        <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>

    <section id="home" class="hero">
      <div class="hero-inner reveal">
        <span class="status-badge" data-i18n="hero.status"></span>
        <h1 class="hero-name">Idom</h1>
        <p class="hero-role" data-i18n="hero.role"></p>
        <p class="hero-tagline" data-i18n="hero.tagline"></p>
        <p class="hero-bio" data-i18n="hero.bio"></p>
        <div class="hero-actions">
          <a href="#projects" class="btn btn-primary" data-i18n="hero.viewProjects"></a>
          <a href="#contact" class="btn btn-outline" data-i18n="hero.contactMe"></a>
        </div>
      </div>
    </section>

    <section id="about" class="section">
      <div class="section-inner reveal">
        <h2 class="section-title" data-i18n="about.title"></h2>
        <div class="about-content">
          <img class="about-avatar" src="https://files.catbox.moe/mlx3eq.jpeg" alt="Faisal, Idom" />
          <p class="about-text" data-i18n="about.text"></p>
        </div>
      </div>
    </section>

    <section id="skills" class="section section-alt">
      <div class="section-inner reveal">
        <h2 class="section-title" data-i18n="skills.title"></h2>
        <div class="skills-grid">
          <span class="skill-tag">JavaScript</span>
          <span class="skill-tag">CSS</span>
          <span class="skill-tag">Lua</span>
          <span class="skill-tag">Node.js</span>
        </div>
      </div>
    </section>

    <section id="build" class="section">
      <div class="section-inner reveal">
        <h2 class="section-title" data-i18n="build.title"></h2>
        <div class="build-grid">
          <div class="build-card">
            <h3 data-i18n="build.discord.title"></h3>
            <p data-i18n="build.discord.desc"></p>
          </div>
          <div class="build-card">
            <h3 data-i18n="build.rp.title"></h3>
            <p data-i18n="build.rp.desc"></p>
          </div>
          <div class="build-card">
            <h3 data-i18n="build.web.title"></h3>
            <p data-i18n="build.web.desc"></p>
          </div>
          <div class="build-card">
            <h3 data-i18n="build.custom.title"></h3>
            <p data-i18n="build.custom.desc"></p>
          </div>
        </div>
      </div>
    </section>

    <section id="projects" class="section section-alt">
      <div class="section-inner reveal">
        <h2 class="section-title" data-i18n="projects.title"></h2>
        <div class="soon-card" id="projectsList">
          <span class="soon-tag" data-i18n="projects.soon"></span>
          <p data-i18n="projects.comingSoon"></p>
        </div>
      </div>
    </section>

    <section id="systems" class="section">
      <div class="section-inner reveal">
        <h2 class="section-title" data-i18n="systems.title"></h2>
        <div class="soon-card" id="systemsList">
          <span class="soon-tag" data-i18n="systems.soon"></span>
          <p data-i18n="systems.comingSoon"></p>
        </div>
      </div>
    </section>

    <section id="experience" class="section section-alt">
      <div class="section-inner reveal">
        <h2 class="section-title" data-i18n="experience.title"></h2>
        <div class="timeline">
          <div class="timeline-item">
            <h3 data-i18n="experience.selfTaught.title"></h3>
            <p data-i18n="experience.selfTaught.desc"></p>
          </div>
          <div class="timeline-item">
            <h3 data-i18n="experience.discordDev.title"></h3>
            <p data-i18n="experience.discordDev.desc"></p>
          </div>
          <div class="timeline-item">
            <h3 data-i18n="experience.rpDev.title"></h3>
            <p data-i18n="experience.rpDev.desc"></p>
          </div>
          <div class="timeline-item">
            <h3 data-i18n="experience.current.title"></h3>
            <p data-i18n="experience.current.desc"></p>
          </div>
        </div>
      </div>
    </section>

    <section id="contact" class="section">
      <div class="section-inner reveal">
        <h2 class="section-title" data-i18n="contact.title"></h2>
        <div class="contact-grid">
          <a class="contact-card" href="https://discord.com/users/1149991645203406848" target="_blank" rel="noopener noreferrer">
            <span class="contact-label" data-i18n="contact.discordLabel"></span>
            <span class="contact-value">Idom</span>
          </a>
          <a class="contact-card" href="mailto:Fyhj0230@gmail.com">
            <span class="contact-label" data-i18n="contact.emailLabel"></span>
            <span class="contact-value">Fyhj0230@gmail.com</span>
          </a>
        </div>
        <p class="contact-note" data-i18n="contact.note"></p>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="views-counter" id="viewsCounter">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        <span id="viewsCount">—</span>
        <span data-i18n="views"></span>
      </div>
      <p class="footer-copy">© 2026 Faisal “Idom”. All Rights Reserved.</p>
      <p class="footer-credit" data-i18n="footer.designed"></p>
    </div>
  </footer>

  <script src="i18n.js"></script>
  <script src="views.js"></script>
  <script src="main.js"></script>
</body>
</html>
